spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stms}
    username: ${DB_USERNAME:stms_user}
    password: ${DB_PASSWORD:stms_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.stms: INFO
    org.springframework.web: WARN
