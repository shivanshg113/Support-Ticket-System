spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stms}
    username: ${DB_USERNAME:stms_user}
    password: ${DB_PASSWORD:stms_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns schema; Hibernate only validates
    show-sql: false
    open-in-view: false           # Disable OSIV — prevent lazy-load surprises in controllers
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never        # Never expose raw exception messages
    include-stacktrace: never     # Never expose stack traces to clients
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Support Ticket Management System
    version: 1.0.0
    description: Production-grade ticket lifecycle management

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: STMS REST API
    version: v1.0
    description: Support Ticket Management System — full API reference

logging:
  level:
    com.stms: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
